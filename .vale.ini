# Prose rules for geodata-llm-eval.
#
# The custom styles are adapted from portolan-sdi/portolan-ops. Google and
# Microsoft rules provide the general developer-documentation baseline.
# Readability supplies document-level metrics. See docs/PROSE.md.

StylesPath = styles
MinAlertLevel = suggestion
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip, https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip, https://github.com/vale-cli/readability/releases/download/v0.1.1/Readability.zip

[*.{md,mdx}]
BasedOnStyles = Vale, Geodata-Terms, Geodata-Mechanics, Geodata-Voice, Geodata-Docs, Google, Microsoft, Readability

Vale.Spelling = NO
TokenIgnores = (`[^`]+`), ([\w.-]+/[\w.-]+), ([a-z0-9]+(?:-[a-z0-9]+)+)

# Keep Microsoft checks that add distinct editorial value. These checks either
# conflict with local conventions, duplicate a Geodata rule, or produce
# domain-specific false positives (for example, "agent" as a deprecated term).
Microsoft.Contractions = NO
Microsoft.Dashes = NO
Microsoft.Ellipses = NO
Microsoft.FirstPerson = NO
Microsoft.GeneralURL = NO
Microsoft.HeadingColons = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Headings = NO
Microsoft.OxfordComma = NO
Microsoft.Passive = NO
Microsoft.Quotes = NO
Microsoft.Semicolon = NO
Microsoft.SentenceLength = NO
Microsoft.Terms = NO
Microsoft.Uppercase = NO
Microsoft.Vocab = NO

# ARI and Flesch Reading Ease are enough to show a trend. Their targets remain
# suggestions because technical names unavoidably raise prose scores.
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO

# These checks conflict with local rules, duplicate them, or produce
# domain-specific false positives. In particular, FirstPerson reads the I in
# Annex I as a pronoun, and WordListCase treats geometric "touch" as a UI verb.
Google.Acronyms = NO
Google.Colons = NO
Google.Contractions = NO
Google.Ellipses = NO
Google.EmDash = NO
Google.FirstPerson = NO
Google.Headings = NO
Google.LyHyphens = NO
Google.OxfordComma = NO
Google.Parens = NO
Google.Passive = NO
Google.Quotes = NO
Google.We = NO
Google.WordList = NO
Google.WordListCase = NO

# Agent context and machine-produced reports are not handwritten docs.
# Report prose is checked from a representative generated file in
# tests/test_prose_styles.py, so fixes land in harness/report.py.
[AGENTS.md]
BasedOnStyles =

[.claude/**]
BasedOnStyles =

[results/report.md]
BasedOnStyles =

[results/ablations.md]
BasedOnStyles =

[**/{node_modules,.venv,venv,vendor,site-packages,.git}/**]
BasedOnStyles =

[**/{LICENSE,LICENCE,COPYING,NOTICE,CHANGELOG}*]
BasedOnStyles =
