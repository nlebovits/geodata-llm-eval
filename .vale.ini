# Prose rules for geodata-llm-eval.
#
# The custom styles are adapted from portolan-sdi/portolan-ops. Google rules
# provide the general developer-documentation baseline. See docs/PROSE.md.

StylesPath = styles
MinAlertLevel = suggestion
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip

[*.{md,mdx}]
BasedOnStyles = Vale, Geodata-Terms, Geodata-Mechanics, Geodata-Voice, Geodata-Docs, Google

Vale.Spelling = NO
TokenIgnores = (`[^`]+`), ([\w.-]+/[\w.-]+), ([a-z0-9]+(?:-[a-z0-9]+)+)

# These checks conflict with local rules, duplicate them, or produce
# domain-specific false positives. In particular, FirstPerson reads the I in
# Annex I as a pronoun, and WordListCase treats geometric "touch" as a UI verb.
Google.Acronyms = NO
Google.Colons = NO
Google.Contractions = NO
Google.Ellipses = NO
Google.EmDash = NO
Google.FirstPerson = NO
Google.Headings = NO
Google.LyHyphens = NO
Google.OxfordComma = NO
Google.Parens = NO
Google.Passive = NO
Google.Quotes = NO
Google.We = NO
Google.WordList = NO
Google.WordListCase = NO

# Agent context and machine-produced reports are not handwritten docs.
# Report prose is checked from a representative generated file in
# tests/test_prose_styles.py, so fixes land in harness/report.py.
[AGENTS.md]
BasedOnStyles =

[.claude/**]
BasedOnStyles =

[results/report.md]
BasedOnStyles =

[results/ablations.md]
BasedOnStyles =

[**/{node_modules,.venv,venv,vendor,site-packages,.git}/**]
BasedOnStyles =

[**/{LICENSE,LICENCE,COPYING,NOTICE,CHANGELOG}*]
BasedOnStyles =
