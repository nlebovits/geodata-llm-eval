# Ablation arms: named specs to run the benchmark against.
#
# An arm is applied to the workspace copy after it is assembled, so SPEC.md
# itself is never modified. Every heading named here is checked against the
# rendered spec before the first session starts, so a typo aborts the sweep
# in a second rather than producing an arm that ablated nothing, scored like
# the baseline, and read as "the spec does not matter".
#
# This file is never mounted into a session: the workspace receives only the
# rendered SPEC.md view and the input list. A session that could read this
# file would be handed a list of exactly what was withheld from it.
# tests/test_run.py pins that.
#
# The cut unit is a SPEC.md heading. Sections (## 4., ## 5., ...) correspond
# to the former policy documents; single rules (### Rule: ...) are the
# narrow arms. Cutting a rule removes its grading equivalences with it,
# because both live in the same block of the source document.
#
# `why` is required. It is reprinted under the report table.

baseline: full

arms:

  full:
    why: >
      The complete spec. Every other arm reads as a delta against this one,
      so a sweep must include it rather than reusing an older run.
    ops: []

  no-coops:
    why: >
      Withholds buyer and cooperative matching entirely. Stages 5 and 6
      consume it and stages 1 to 4 do not, so movement in the early stages is
      cascade or noise rather than an effect of the missing section.
    ops:
      - cut:
          file: SPEC.md
          heading: "8. Cooperative and buyer candidates"

  no-inputs:
    why: >
      Withholds the input-list handling rules: the encodings, the defect
      table, and the reconciliation identity. The Goias list carries one
      instance of every defect the section names, so a session without it has
      to infer the handling from the data. Correct handling resolves to the
      same 117 parcels as a clean list, so a mishandled defect shows up twice:
      directly in q31, and as a cascade through every parcel-level answer.
    ops:
      - cut:
          file: SPEC.md
          heading: "4. Input list handling"

  no-matching:
    why: >
      Withholds the field-to-cadaster matching rules: both inclusion tests,
      the thresholds, and the tie rules. Stage 3 onward reads everything it
      produces, so this is the widest blast radius of any single section.
    ops:
      - cut:
          file: SPEC.md
          heading: "5. Field–parcel matching"

  no-crops:
    why: >
      Withholds the EUDR scope table and the crop-to-tier routing. Decides
      which fields count as in scope at all, so damage should start at
      stage 4 and carry through the coop questions.
    ops:
      - cut:
          file: SPEC.md
          heading: "7. EUDR scope and routing"

  no-widening:
    why: >
      Keeps the candidate-matching section but removes only the
      radius-widening rule. Narrower than no-coops: it isolates one procedure
      inside a section the session can otherwise still read, which separates
      "cannot find the policy" from "has the policy and applies it wrongly".
    ops:
      - cut:
          file: SPEC.md
          heading: "Rule: widening"

  no-tie-rules:
    why: >
      Removes the tie rules from both matching stages: the primary-cadaster
      rule (which carries the exact-tie tolerance and the lowest-cod_imovel
      tie-break) and the candidate ranking order (which carries the
      lowest-entity_id tie-break). These decided eight questions when they
      were unwritten, so this arm is the direct measurement of what writing
      them down bought. Wider than the pre-consolidation arm of the same
      name, which cut the tie prose without the surrounding rules; scores are
      only comparable within a spec fingerprint anyway.
    ops:
      - cut:
          file: SPEC.md
          heading: "Rule: primary-cadaster"
      - cut:
          file: SPEC.md
          heading: "Rule: ranking"
